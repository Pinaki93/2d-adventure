<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17202a">
  <title>Wildharvest</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="game" aria-label="Wildharvest game">
      <canvas id="game" width="320" height="180" tabindex="0">
        Your browser needs Canvas support to play Wildharvest.
      </canvas>
      <div class="hud" aria-live="polite">
        <span>Bag: 🍎 <b id="apple">0</b> 🍊 <b id="orange">0</b> 🫐 <b id="blueberry">0</b></span>
        <span>Order: 🍎 <b id="apple-needed">0</b> 🍊 <b id="orange-needed">0</b> 🫐 <b id="blueberry-needed">0</b></span>
        <span>Delivered: <b id="orders-completed">0</b></span>
        <span>Camp: <b id="camp-direction">● 0m</b></span>
      </div>
      <div id="delivery" class="delivery" role="status">Order delivered!</div>
    </section>
    <div class="controls" aria-label="Movement controls">
      <button class="up" type="button" data-key="arrowup" aria-label="Move up">▲</button>
      <button class="left" type="button" data-key="arrowleft" aria-label="Move left">◀</button>
      <button class="down" type="button" data-key="arrowdown" aria-label="Move down">▼</button>
      <button class="right" type="button" data-key="arrowright" aria-label="Move right">▶</button>
    </div>
    <p>Move with <span class="touch-hint">the D-pad</span><span class="keyboard-hint"><kbd>WASD</kbd> or <kbd>arrow keys</kbd></span> · Gather the order, return to camp, and use matching numbered caves to travel</p>
    <button id="clear-progress" type="button">Clear progress</button>
  </main>
  <script src="game.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
